name: Deploy Docker Compose App to Azure Web App

on:
  push:
    branches:
      - james
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t thetygerpotatto/backend:latest ./backend

      - name: Build frontend (nginx) image
        run: docker build -t thetygerpotatto/frontend:latest ./frontend
        
      - name: Build frontend (nginx) image
        run: docker build -t thetygerpotatto/database:latest ./database

      - name: Push images
        run: |
          docker push thetygerpotatto/backend:latest
          docker push thetygerpotatto/frontend:latest
          docker push thetygerpotatto/database:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Docker Compose)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stickyapp'
          slot-name: 'Production'
          multicontainer_config_file: "docker-compose.yml"
