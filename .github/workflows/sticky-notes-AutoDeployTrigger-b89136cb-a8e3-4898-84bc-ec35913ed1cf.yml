name: Trigger auto deployment for sticky-notes

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ james ]
    paths:
    - '**'
    - '.github/workflows/sticky-notes-AutoDeployTrigger-b89136cb-a8e3-4898-84bc-ec35913ed1cf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.STICKYNOTES_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.STICKYNOTES_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.STICKYNOTES_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.STICKYNOTES_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.STICKYNOTES_REGISTRY_PASSWORD }}
          containerAppName: sticky-notes
          resourceGroup: DefaultResourceGroup-SCUS
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


